<script>
  function go_auth_code_chk(){
    if(login_id=="testuser"){
      alert("테스트 아이디는 수정/삭제가 불가 합니다.");
      return false;
    }

    var auth_status = $("#auth_status").val();
    if(!auth_status){
      alert("인증번호를 발송해주세요.");
      return false;
    }

    var code = $("#code").val();
    if(!code){
      alert("인증번호를 입력해주세요.");
      return false;
    }

    $.ajax({
       type : "POST",
       url: "/ajax/_ajax_auth_code_chk.php",
       dataType: "json",
       data: {
         mb_no : $("#mb_no").val(),
         code : $("#code").val(),
         phone : $("#userinput7").val()
       },
       success: function(result) {
          console.log(result);
          if(result.status==1){
            alert(result.msg);
            $("#auth_status").val(2);
            $("#hp_cert").val(1);
            if (confirm("인증이 완료되었습니다. 메인으로 이동할까요?")) {
              location.href = "/adm/index.php";
            } else {
              location.reload();
            }
          }else{
            alert(result.msg);
            return false;
          }
       },
       error:function(e) {
          alert(e.responseText);
       }
    });
  }

  function go_send_code(){
    if(login_id=="testuser"){
      alert("테스트 아이디는 수정/삭제가 불가 합니다.");
      return false;
    }

  var auth_status = $("#auth_status").val();
  if(auth_status==1){
    alert("인증번호가 도착하지 않았다면 새로고침 후 재발송 해주세요.");
    return false;
  }

    var phone = ($("#userinput7").val() || "").trim();
    if (!phone) {
      alert("휴대폰 번호를 입력해주세요.");
      $("#userinput7").focus();
      return false;
    }

    $.ajax({
       type : "POST",
       url: "/ajax/_ajax_auth_number.php",
       dataType: "json",
       data: {
         mb_no : $("#mb_no").val(),
         phone : phone
       },
       success: function(result) {
          console.log(result);
          if(result.status==1){
            alert(result.msg);
            $(".auth_code_form").show();
            $("#auth_status").val(1);
            $("#code").focus();
          }else{
            alert(result.msg);
            return false;
          }
       },
       error:function(e) {
          alert(e.responseText);
       }
    });
  }
  function go_info_update(){
    if(login_id=="testuser"){
      alert("테스트 아이디는 수정/삭제가 불가 합니다.");
      return false;
    }

    var password = $("#userinput3").val();
    var repassword = $("#userinput4").val();
    var auth_status = $("#auth_status").val();
    var my_number = $("#my_number").val();
    var update_num = $("#userinput7").val();
    var hp_cert = $("#hp_cert").val();

    if (hp_cert != 1 || my_number != update_num) {
      if (auth_status != 2) {
        alert("휴대폰 번호 인증을 완료해주세요.");
        return false;
      }
    }

    if(password){
      if(password != repassword){
        alert("변경할 비밀번호가 같지 않습니다.");
        return false;
      }
    }

    var user_hp = $("#userinput7");
    if(!user_hp.val()){
      alert("휴대폰 번호는 필수 입니다.");
      return false;
    }

    var params = jQuery("#regFrm").serialize();
    $.ajax({
      type : "POST",
      url: "/ajax/_ajax_member_info_update.php",
      data: params,
      dataType: "json",
      success: function(result) {
        console.log(result);
        if(result.status==1){
          alert(result.msg);
          location.reload();
        }else{
          alert(result.msg);
          return false;
        }
      },
      error:function(e) {
        alert(e.responseText);
      }
    });
  }
</script>
