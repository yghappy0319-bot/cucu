  F_admin_chk($S_login);

  if (!$page) $page = 1;
  if ($S_login['limit']) $limit = $S_login['limit'];

  $PARAM = "&order=$order&find_text=$find_text&find_object=$find_object&limit=$limit&winyn=$winyn&pdate=$pdate&limit=$limit";

  // superadmin만 1, 2, 3등 조회 가능
  if ($S_login['level'] == 4) {
    $add_query = "";
  } else {
    $filter = "NOT IN (1,2,3)";

    for ($i = 1; $i <= 5; $i++) {
      $default = " AND WIN{$i} {$filter}";
      $add_query .= $default;
    }
  }

  $add_query .= " AND SIGN_YN != 'C'";

  // 당첨된 티켓만 조회
  $add_query .= " AND WIN_YN='Y'";

  // 당첨금이 지급된 이후 데이터만 조회
  $add_query .= " AND WIN_MONEY_YN = 'Y'";

  if ($gubun != "") {
    $add_query .= " AND GUBUN='{$gubun}'";
  }

  if ($pdate != "") {
    $add_query .= " AND PLAYDATE='{$pdate}'";
  }

  $list = F_ORDERS_list(array(
    "row"         => $limit,
    "page"        => $page,
    "order"       => $order,
    "find_text"   => $find_text,
    "find_object" => $find_object,
    "add_query"   => $add_query,
  ));

  if ($list['total'] == 0) {
    $list['ORDERS_NO'] = array();
  }

<script>
  $(function() {
  });

  $('.btn-detail').click(function() {
    let no = $(this).data('no');
    let obj = $('#order-view');

    $.post('./default.php', {
      mode: 'read_order',
      no: no
    }, function(e) {
      obj.find('#user_id').val(e.USER_ID);
      obj.find('#gubun').val(e.ball_name);
      obj.find('#hp').val(e.HP);
      obj.find('#cnt').val(e.GAMECNT);
      obj.find('#playdate').val(e.PLAYDATE);
      obj.find('#authnum').val(e.AUTHNUM);
      obj.find('#cardcd').val(e.CARDCD);
      obj.find('#payment').val(e.PAYMENT);
      obj.find('#vat').val(e.VAT);
      obj.find('#ball1').val(e.BALL1);
      obj.find('#ball2').val(e.BALL2);
      obj.find('#ball3').val(e.BALL3);
      obj.find('#ball4').val(e.BALL4);
      obj.find('#ball5').val(e.BALL5);
    }, 'json');
  });
</script>
