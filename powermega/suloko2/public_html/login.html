<script>

  $(function() {
    setBannerImg();
  });
  $(window).on("beforeunload", function() {
    setBannerImg();
  });

  $('.login_frm_btn').click(function() {
    let i = true;
    let rememberme = '';

    $('.frm_check_on').each(function() {
      if ($.trim($(this).val()) == '') {
        alert($(this).attr('alt'));
        $(this).focus();
        i = false;
        return false;
      }
    });

    if (!i) {
      return false;
    }

    if ($('#frm_rememberme').is(':checked')) {
      rememberme = 'Y';
    }

    $.post('/login.php', {
      user_id: $('#frm_id').val(),
      passwd: $('#frm_passwd').val(),
      rememberme: rememberme,
    }, function(e) {
      if (!e.error) {
        let url = document.referrer;

        if (url != '') {
          location.href = url+e.qs;
        } else {
          location.href = '/'+e.qs;
        }
      } else {
        alert(e.msg);
      }
    }, 'json');
  });
</script>
