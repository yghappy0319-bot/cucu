<script>
  $(function() {
    $(document).on('click', '.ballFunC', function() {
      let play_date = $(this).data('pdate');

      $.post('./default.php', {
        mode: 'ball_no',
        play_date: play_date
      }, function(e) {
        if (e.error) {
          $('#pdate').val(play_date);
          $('#ball1').val(e.ball1);
          $('#ball2').val(e.ball2);
          $('#ball3').val(e.ball3);
          $('#ball4').val(e.ball4);
          $('#ball5').val(e.ball5);
          $('#ballp').val(e.ballp);
        } else {
          alert('정확한 추첨일자를 입력해 주세요.');
        }
      }, 'json');
    });

    $(document).on('click', '#btn-ball-in', function() {
      let play_date = $('#pdate').val();

      let ball1 = $('#ball1').val();
      let ball2 = $('#ball2').val();
      let ball3 = $('#ball3').val();
      let ball4 = $('#ball4').val();
      let ball5 = $('#ball5').val();
      let ballp = $('#ballp').val();

      $.post('./default.php', {
        mode: 'ball_no_in',
        play_date: play_date,
        ball1: ball1,
        ball2: ball2,
        ball3: ball3,
        ball4: ball4,
        ball5: ball5,
        ballp: ballp
      }, function(e) {
        alert(e.msg);
        if (e.error) {
          window.location.reload();
        }
      }, 'json');
    });
  });
</script>
