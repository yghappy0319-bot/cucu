<script>
    $(document).ready(function() {
        $(document).on('click', '.gubun', function() {
            $.post('/other.php', {
                mode : 'search_date',
                schdate : $(this).data('tp')
            }, function(e) {
                if (e.errNo > 0) {
                } else {
                    $('#sdate').val(e.sdate);
                    $('#edate').val(e.edate);
                }
            }, 'json');
        });

        let page = 1;
        list_read(page);

        $(document).on('click', '.type_btn_more', function() {
            page++;
            list_read(page);
        });

        // 스캔본 확인
        $(document).on('click', '.btn_popup.scanImgSwiper', function() {
            let no = $(this).data('no');
            let btnName = $(this).attr('id');

            let loadingImg = `
        <li class='swiper-slide' style='width: 400px; line-height: 400px;'>
          <img src='/common/images/loading.gif' style='width: 50px; vertical-align: middle;'>
        </li>`;
            $('.scanImgSwiper').find('.swiper-wrapper').append(loadingImg);

            // show popup
            btnName = btnName.substr(4, btnName.length);
            showPopup(btnName);

            $.post('/other.php', {
                mode: 'get_ticket_images',
                no: no
            }, function(e) {
                $('.scanImgSwiper').find('.swiper-slide').remove();
                $('.scanImgSwiper').find('.swiper-wrapper').append(e.html);
            }, 'json');
        });

        // 스캔본 확인 닫기
        $(document).on('click', '.sec_event .btn_close', function() {
            $('.scanImgSwiper').find('.swiper-slide').remove();
        });

        function list_read(page) {
            let sdate = $('#sdate').val();
            let edate = $('#edate').val();

            $.post('/other.php', {
                mode: 'my_shop_order_list',
                sdate: sdate,
                edate: edate,
                page: page
            }, function(e) {
                $('#list_box').append(e.html);
                if (e.html == '') {
                    $('.type_btn_more').hide();
                }

                if ($('#list_box').find('tbody').length <= 0 && page == 1) {
                    let html = `
            <tbody id="box">
              <tr>
                <td style="text-align: center;">사용내역이 없습니다.</td>
              </tr>
            </tbody>`;
                    $('#list_box').html(html);
                }
            }, 'json');
        }
    });
</script>
