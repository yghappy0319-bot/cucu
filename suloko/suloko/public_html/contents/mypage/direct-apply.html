<script>
  $(document).ready(function() {

    // 휴대폰 번호 하이픈 자동 입력
    function autoHypenTel(phoneNum) {
      phoneNum = phoneNum.replace(/[^0-9]/g, '');
      let result = [];
      let restNumber = '';

      result.push(phoneNum.substr(0, 3));
      restNumber = phoneNum.substring(3);

      if (restNumber.length === 7) {
        result.push(restNumber.substring(0, 3));
        result.push(restNumber.substring(3));
      } else {
        result.push(restNumber.substring(0, 4));
        result.push(restNumber.substring(4));
      }

      return result.filter((val) => val).join('-');
    }

    $('#tel').keyup(function (event) {
      event = event || window.event;
      let _val = this.value.trim();
      this.value = autoHypenTel(_val);
    });

    $(document).on("click", ".okBtn", function() {
      let i = true;

      $(".chk_on").each(function() {
        if ($.trim($(this).val()) == '') {
          alert($(this).attr("alt"));
          $(this).focus();
          i = false;
          return false;
        }
        if ($(this).attr("id") === "subject" && $(this).val().length > 50) {
          alert("제목은 50자 이내로 작성해 주세요.");
          $(this).focus();
          i = false;
          return false;
        }
      });

      if (i) {
        $('[name="w_frm"]').submit();
      } else {
        return false;
      }
    });
  });
</script>
