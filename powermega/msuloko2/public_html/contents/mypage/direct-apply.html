<script>
  $(function() {
    let submitting = false;  // 중복 제출 방지

    $('#tel').keyup(function (event) {
      event = event || window.event;
      let _val = this.value.trim();
      this.value = autoHypenTel(_val);
    });
    $(document).on("click", ".okBtn", function() {
      if (submitting) return false;

      let i = true;

      $(".chk_on").each(function() {
        if ($.trim($(this).val()) == '') {
          alert($(this).attr("alt"));
          $(this).focus();
          i = false;
          return false;
        }
        if ($(this).attr("id") === "subject" && $(this).val().length > 50) {
          alert("제목은 50자 이내로 작성해 주세요.");
          $(this).focus();
          i = false;
          return false;
        }
      });

      if (!i) return false;

      submitting = true;
      let $btn = $(this);
      let $frm = $('#w_frm');
      let formData = new FormData($frm[0]);

      $btn.prop('disabled', true);

      $.ajax({
        url: './direct-apply-action.php',
        type: 'POST',
        data: formData,
        processData: false,
        contentType: false,
        dataType: 'json',
        async: false
      }).done(function(res) {
        if (res.error) {
          alert(res.msg || '처리 중 오류가 발생했습니다.');
          submitting = false;
          $btn.prop('disabled', false);
          return;
        }
        alert(res.msg || '문의가 접수되었습니다.');
        location.href = res.url || '/contents/cs/direct.html';
      }).fail(function(xhr, status, err) {
        alert('전송에 실패했습니다. 다시 시도해 주세요.');
        submitting = false;
        $btn.prop('disabled', false);
      });
    });


  });
</script>
