<script>
  $(document).ready(function() {
    // 선택삭제
    $(document).on("click", ".allDelChk", function() {
      let chk_no = new Array();
      let i = 0;
      $('[name="noChk[]"]:checked').each(function() {
        chk_no[i] = $(this).val();
        i++;
      });

      if (i > 0) {
        if (confirm("선택한 커미션 그룹을 삭제하시겠습니까?")) {
          $.post("./default.php", {
            mode: "all_policy_delete",
            chk_no: chk_no
          }, function(e) {
            alert(e.msg);
            if (e.error) {
            } else {
              window.location.reload();
            }
          }, "json");
        }
      } else {
        alert("삭제할 항목을 선택하세요");
      }
    });

    // 정책추가
    $(document).on("click", "#btn_add_comm_policy", function() {
      window.location.href="commission_policy_detail.html";
    });
  });
</script>
