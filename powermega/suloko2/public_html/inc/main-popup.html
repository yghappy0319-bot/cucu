$currentTime = time();
$remainingTime = $targetDate - $currentTime;

$days = floor($remainingTime / (60 * 60 * 24));
$hours = floor(($remainingTime % (60 * 60 * 24)) / (60 * 60));
$minutes = floor(($remainingTime % (60 * 60)) / 60);
$seconds = $remainingTime % 60;
?>
<script>
  document.addEventListener("DOMContentLoaded", function() {
      var targetTime = new Date("May 20, 2025 23:59:59").getTime();
      var interval = setInterval(function() {
          var now = new Date().getTime();
          var remainingTime = targetTime - now;

          var days = Math.floor(remainingTime / (1000 * 60 * 60 * 24));
          var hours = Math.floor((remainingTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          var minutes = Math.floor((remainingTime % (1000 * 60 * 60)) / (1000 * 60));
          var seconds = Math.floor((remainingTime % (1000 * 60)) / 1000);

          document.getElementById("countdown").innerHTML = days + "일 " + hours + "시간 " + minutes + "분 " + seconds + "초<br>이벤트가 종료됩니다.";

          if (remainingTime < 0) {
              clearInterval(interval);
              document.getElementById("countdown").innerHTML = "이벤트가 종료되었습니다!";
          }
      }, 1000);
  });
</script>
