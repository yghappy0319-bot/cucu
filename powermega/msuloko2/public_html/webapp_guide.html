<script>
  $(document).on('click', '.app_hp_btn', function() {
    let hp = $('#app_phone').val();

    if (hp == '') {
      alert('휴대폰 번호를 입력해 주세요.');
      $('.nbaMask').css('z-index', '20000');
      $('.nbaDialog').css('z-index', '25000');
      return false;
    }

    $.post('/other.php', {
      mode: 'app_sms',
      hp: hp
    }, function(e) {
      alert(e.msg);
      $('.nbaMask').css('z-index', '20000');
      $('.nbaDialog').css('z-index', '25000');
      if (!e.error) {
        setTimeout(() => {
          $('#app_phone').val('');
          $('.btn_close').trigger('click');
        }, 100);
      }
    }, 'json');
  });
</script>
