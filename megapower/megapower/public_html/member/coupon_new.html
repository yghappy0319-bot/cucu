        <script>
          function go_get_coupon(cidx){
            $.ajax({
               type : "POST",
               url: "ajax_coupon_download.php",
               async: false,
               data: {
                  cidx : cidx
               },
               success: function(result) {
                  var obj = jQuery.parseJSON(result);
                  if(obj.status=="session_null"){
                    alert('로그인 후 이용가능한 서비스 입니다.');
                    _go_login();
                    //top.location.href='/member/login.html';
                  }else if(obj.status=="ok"){
                    alert(obj.msg);
                    location.reload();
                  }else if(obj.status=="no"){
                    alert("이미 발급 받은 쿠폰 입니다.");
                    return false;
                  }

               },
               error:function(e) {
                  alert(e.responseText);
               }
            });
          }
          function go_coupon_delete(){
            if(confirm("사용완료, 기간만료 쿠폰을 전체 삭제 하시겠습니까?")){
              $.ajax({
                 type : "POST",
                 url: "ajax_coupon_delete.php",
                 async: false,
                 data: {
                 },
                 success: function(result) {
                    var obj = jQuery.parseJSON(result);
                    if(obj.status=="ok"){
                      alert("사용완료, 기간만료 쿠폰 삭제 완료");
                      location.reload();
                    }
                 },
                 error:function(e) {
                    alert(e.responseText);
                 }
              });
            }
          }
