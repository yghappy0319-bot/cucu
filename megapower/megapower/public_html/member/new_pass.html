<script>
  function go_password_update(){
    var newpass = $("#newpass").val();
    var newrepass = $("#newrepass").val();
    if(!newpass){
      alert("변경할 비밀번호를 입력해주세요.");
      return false;
    }
    if(!newrepass){
      alert("변경할 비밀번호를 재입력해주세요.");
      return false;
    }

    if(newpass!=newrepass){
      alert("비밀번호가 다릅니다.");
      return false;
    }

    var params = jQuery("#idpassFrm").serialize();
      $.ajax({
        type : "POST",
        url: "_ajax_new_pass_update.php",
        async: false,
        data: params,
        dataType: "json",
        success: function(result) {
          if(result==1){
            alert("변경되었습니다.");
            location.href="/";
            return false;
          }

        },
        error:function(e) {
          alert(e.responseText);
        }
      });
  }
</script>
