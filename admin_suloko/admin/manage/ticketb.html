function random_numeric_code(int $length = 8): string {
    // 길이 검증 (원하면 제한 걸기)
    if ($length < 1) { throw new InvalidArgumentException('length must be >= 1'); }

$num = (string) random_int(0, (10 ** $length) - 1);
return str_pad($num, $length, '0', STR_PAD_LEFT);
}

                  function generateImageTagsFromNumber($number, $이미지경로) {
                      // 숫자를 문자열로 변환하여 각 자릿수를 배열로 나눔
                      $number_str = strval($number);
                      $img_tags = '';

                      // 각 자릿수를 반복하여 img 태그 생성
                      for ($i = 0; $i < strlen($number_str); $i++) {
                          $digit = $number_str[$i]; // 현재 자릿수 (0~9)

                          $imageSrc = $이미지경로."/back_number/{$digit}.png?date=".date('his');
                          $img_tags .= "<img src='{$imageSrc}' alt='{$digit}' class='t_number' />";
                            }

                            // 이미지 태그 문자열 반환
                            return $img_tags;
                            }
                            echo generateImageTagsFromNumber($BACK_CODE, $이미지경로);
