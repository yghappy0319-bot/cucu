<script>
  $(function() {
    let ok_check = false;

    $('.okBtn').click(function() {
      let i = true;

      if (ok_check) {
        return false;
      }

      ok_check = true;

      $('.chk_on').each(function() {
        if ($.trim($(this).val()) == '') {
          alert($(this).attr('alt'));
          $(this).focus();
          i = false;
          return false;
        }
      });

      if (i) {
        $('[name="w_frm"]').submit();
      } else {
        ok_check = false;
      }
    });

    $('.check_file').change(function() {
      let fileName = $(this).val();
      $(this).next('.fileName').val(fileName);

      let val = $(this)[0].files[0];
      let reader = new FileReader();
      let filePath = $(this).val().toLowerCase().split('.');
      let fileType = filePath[filePath.length - 1];

      if (/image\/\w+/.test(val.type)) {
      } else if (fileType === 'm4a' || fileType === 'mp4') {
      } else {
        alert('업로드 할 수 없는 파일입니다.');
        $(this).next('.fileName').val('');
        return false;
      }

      let size = (val.size / 1024).toFixed(1);
      size = (size / 1024).toFixed(30)

      if (size > 30) {
        alert('파일의 최대용량(30MB)을 초과하였습니다.');
        $(this).next('.fileName').val('');
        return false;
      }
      reader.readAsDataURL(val);
    });
  });
</script>
