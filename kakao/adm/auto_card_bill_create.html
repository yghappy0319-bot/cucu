<script type="text/javascript">
function go_auto_cencel(){
  if(confirm("자동결제를 취소하시겠습니까?")){
    alert("test중 입니다.");
  }
}
function setDate(){
    var d = new Date();
    var year = d.getFullYear();
    var month = d.getMonth()+1;
    var date = d.getDate();
    if ( month < 10 ){
        month = '0' + month;
    }
    if ( date < 10 ){
        date = '0' + date;
    }

    for (var i = 0; i < document.getElementsByName("moid").length; i++) {
        document.getElementsByName("moid")[i].value = year+""+month+""+date+"001";
    }

    for (var i = 0; i < document.getElementsByName("payExpDate").length; i++) {
        document.getElementsByName("payExpDate")[i].value = year+""+month+""+date+"235959";
    }
}

function send(){
  if(confirm("결제가 1회 진행됩니다. 자동결제를 요청하시겠습니까?")){
    var params = jQuery("#orderFrm").serialize();
      $.ajax({
        type : "POST",
        url: "/ajax/_ajax_card_bill_auto.php",
        async: false,
        data: params,
        dataType: "json",
        success: function(result) {
          console.log(result);
          if (result.resultCode == "0000") {
              alert(result.resultMsg);
               window.close();
          } else {
              alert(result.resultMsg);
              location.reload();
              return false;
          }
        },
        error:function(e) {
          alert(e.responseText);
        }
      });
  }

}
function back() {
  window.close();
}

function go_auto_bill_cancel(obj){
  if(confirm("빌링키를 다시 취소/재요청 하시겠습니까?")){
    var userid = $("#userId").val();
    $.ajax({
       type : "POST",
       url: "/ajax/_ajax_card_billkey_cancel.php",
       async: false,
       data: {
         billkey : obj,
         userid : userid
       },
       dataType: "json",
       success: function(result) {
         console.log(result);
         if (result.resultCode == "0000") {
             alert(result.resultMsg);
              window.close();
         } else {
             alert(result.resultMsg);
             location.reload();
             return false;
         }
       },
       error:function(e) {
          alert(e.responseText);
       }
    });
  }
}
