<script>
  function fn_showPw(obj){
    if(obj==1){
      $(".fas.fa-eye-slash").css("display","none");
      $(".fas.fa-eye").show();
    }else{
      $(".fas.fa-eye").css("display","none");
      $(".fas.fa-eye-slash").show();
    }
      var passwordInput = $(".m_password");
      passwordInput.toggleClass('active');
      if(passwordInput.hasClass('active')){
          $(".fas fa-eye").show();
          passwordInput.prop('type', "text");
      } else {
          passwordInput.prop('type', "password");
      }
    }
  function go_new_password_update(){
    var new_pass = $(".new_pass").val();
    var new_repass = $(".new_repass").val();
    if(new_pass!=new_repass){
      alert("입력한 비밀번호가 서로 다릅니다.\n정확한 비밀번호를 입력해주세요.");
      return false;
    }

    if(!isPasswordValid()){
      alert('6자 이상 20자 이하의 비밀번호를 입력해주세요.');
      return false;
    }

    if(confirm("비밀번호를 변경하시겠습니까?")){
      var params = jQuery("#infoFrm").serialize();
        $.ajax({
          type : "POST",
          url: "ajax_new_pass_update.php",
          async: false,
          data: params,
          success: function(result) {
          var r = result.trim();
            if(r==1){
              alert("비밀번호가 변경 되었습니다.");
              location.href="/";
              return false;
            }else{
              alert(r);
              location.href="/member/ajax_logout.php";
              return false;
            }
          },
          error:function(e) {
            alert(e.responseText);
          }
        });
    }
  }
</script>
