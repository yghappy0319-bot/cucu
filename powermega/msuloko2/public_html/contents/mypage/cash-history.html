<script>
  $(document).ready(function() {
    $(document).on('click', '.gubun', function() {
      $.post('/other.php', {
        mode : 'search_date',
        schdate : $(this).data('tp')
      }, function(e) {
        if (e.errNo > 0) {
        } else {
          $('#sdate').val(e.sdate);
          $('#edate').val(e.edate);
        }
      }, 'json');
    });

    let page = 1;
    function list_read(page) {
      let sdate = $('#sdate').val();
      let edate = $('#edate').val();

      $.post('/other.php', {
        mode: 'my_cash_list',
        sdate: sdate,
        edate: edate,
        page: page
      }, function(e) {
        $('#list_box').append(e.html);
        if (e.html == '') {
          $('.type_btn_more').hide();
        }

        if ($('#list_box').find('tbody').length <= 0 && page == 1) {
          let html = `<tbody id="box">
                        <tr>
                          <td style="text-align: center;">등록된 충전내역이 없습니다.</td>
                        </tr>
                      </tbody>`;
          $('#list_box').html(html);
        }
      }, 'json');
    }
    list_read(page);

    $(document).on('click', '.type_btn_more', function() {
      page++;
      list_read(page);
    });

    $(document).on('click', '.bank_cancel', function() {
      let no = $(this).data('no');
      if (confirm('무통장 입금 신청을 취소 하시겠습니까?')) {
        $.post('/other.php', {
          mode: 'bank_cancel',
          no: no
        }, function(e) {
          if (e.error == false) {
            alert(e.msg);
          } else {
            alert('취소 되었습니다.', '/contents/mypage/cash-history.html');
          }
        }, 'json');
      }
    });

    // 입금 대기 - 계좌정보
    $(document).on('click', '.btn_bank_waiting', function() {
      let price = $(this).data('price');
      $('#cash_bank_cash3').html(price);
      $('.bank_step3').addClass('active');
      $('body').css('overflow', 'hidden');
      $('body').css('height', '100%');
    });

    // 현금 영수증 신청
    $(document).on('click', '.apply_cash_receipt', function() {
      let no = $(this).data('no');
      if (confirm('현금 영수증 신청을 하시겠습니까?\n홈택스에서 <현금영수증 소비자 발급수단>을 입력하셔야만 영수증 사용내역이 집계되니 필히 입력하여 주시기 바랍니다.')) {
        $.post('/other.php', {
          mode: 'apply_cash_receipt',
          no: no
        }, function(e) {
          if (e.error) {
            alert('현금영수증 발급 신청이 정상 접수되었습니다.\n 국세청-현금영수증(www.hometax.go.kr)에서 1~2일 후에 확인하실 수 있습니다.');
          } else {
            alert(e.msg);
          }
          location.reload();
        }, 'json');
      }
    })
  });
</script>
