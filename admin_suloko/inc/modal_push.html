<script>
  $(function() {
  });

  $('#templet').change(function() {
    let templet_no = $(this).val();

    if (templet_no == '') {
      $('#subject').val('');
      $('#content').text('');
      return false;
    }

    $.post('/default.php', {
      mode: 'change_sms_templet',
      no: templet_no
    }, function(e) {
      if (e.error) {
        $('#subject').val(e.subject);
        $('#content').text(e.content);
      } else {
        alert(e.msg);
      }
    }, 'json');
  });

  $('.btn_push').click(function() {
    let topic = $('#topic').val();
    let subject = $('#subject').val();
    let content = $('#content').val();
    let is_reserve = $('#is_reserve:checked').val();

    if (!topic) {
      alert('구독을 선택해주세요.');
      return false;
    }

    if (!subject) {
      alert('제목을 작성해주세요.');
      return false;
    }

    if (!content) {
      alert('내용을 작성해주세요.');
      return false;
    }

    // 즉시 발송
    if (is_reserve == 'N') {
      if (confirm('알림을 발송하시겠습니까?')) {
        $.post('/default.php', {
          mode: 'send_push',
          topic : topic,
          subject : subject,
          content : content
        }, function(e) {
          alert(e.msg);
          if (e.error) {
            // 예약 실패시..
          } else {
            $(".btn-close").click();
          }
        },"json");
      }

    // 예약 발송
    } else {
      let r_date = $('#r_date').val();
      let r_hour = $('#r_hour').val();
      let r_min = $('#r_min').val();
      let r_datetime = r_date + ' ' + r_hour + ':' + r_min + ':00';

      if (!r_date) {
        alert("예약일을 선택해 주세요.");
        $('#r_date').focus();
        return false;
      }

      const date1 = new Date(); // 현재시간
      const date2 = new Date(r_datetime); // 예약 시간

      if (date1 >= date2) {
        alert("예약시간이 현재시간보다 이전입니다.");
        return false;
      }

      if (confirm('푸시알림을 에약하시겠습니까?')) {
        $.post('/default.php', {
          mode: 'save_push_reservation',
          topic : topic,
          subject : subject,
          content : content,
          r_datetime : r_datetime
        }, function(e) {
          alert(e.msg);
          if (e.error) {
            // 예약 실패시..
          } else {
            $(".btn-close").click();
          }
        },"json");
      }

    }
  })
</script>
