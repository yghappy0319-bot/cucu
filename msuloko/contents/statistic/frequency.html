  <script>
    $(function() {
      const type = sessionStorage.getItem('type');
      if (type) {
        $(`#${type}`).trigger('click');
      } else {
        $('#mm').trigger('click');
      }

      let currentYear = new Date().getFullYear();
      options = {
        pattern: 'yyyy-mm',
        selectedYear: currentYear,
        startYear: 2015,
        finalYear: 2030,
        monthNames: ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월']
      };

      $('.monthpicker').monthpicker(options);
    });

    $('#mm').click(function() {
      getStatisticData('mm');
    });

    $('#pb').click(function() {
      getStatisticData('pb');
    });

    $('.search_btn').click(function() {
      let isOn = $('ul.tab_type1 li.on');
      let type = isOn.find('a').attr('id');

      let yyyyMM = new Date().toISOString().slice(0, 7);
      let sdate = $('#smonthpicker').val();
      let edate = $('#emonthpicker').val();

      let validationDate = false;

      if (!sdate && !edate) {
        validationDate = true;
      } else if (!sdate || !edate) {
        alert('시작일과 종료일 중 하나만 입력했습니다.');
      } else if (sdate > edate) {
        alert('시작일은 종료일보다 이전이어야 합니다.');
      } else if (sdate > yyyyMM || edate > yyyyMM) {
        alert('현재일 보다 이후 일은 입력할 수 없습니다.');
      } else {
        validationDate = true;
      }

      if (validationDate) {
        let sdateParts = sdate.split('-');
        let edateParts = edate.split('-');

        if (sdate && edate) {
          let message = `${sdateParts[0]}년 ${sdateParts[1]}월부터 ${edateParts[0]}년 ${edateParts[1]}월까지`;
          $('p.info span').text(message);
        }

        $('.wball_list .numbers').closest('tr').remove();
        $('.pball_list .numbers').closest('tr').remove();
      }

      getFrequency(type);
    });

    $('.frequencyPage').click(function() {
      window.location.href = "frequency.html";
    });

    $('.lastdrawnPage').click(function() {
      window.location.href = "lastdrawn.html";
    });

    function getStatisticData(type) {
      sessionStorage.removeItem('type');
      sessionStorage.setItem('type', type);

      $('.monthpicker').val('');

      let gubun = (type === 'mm') ? 'mega' : 'power';
      let oldGubun = (type === 'mm') ? 'power' : 'mega';
      let oldType = (type === 'mm') ? 'pb' : 'mm';
      (type === 'mm') ? $('.logo-wrap span').text('메가밀리언') : $('.logo-wrap span').text('파워볼');
      (type === 'mm') ? $('.logo-wrap p').html('MEGA MILLIONS<sup>®</sup>') : $('.logo-wrap p').html('POWERBALL<sup>®</sup>');
      (type === 'mm') ? $('p.info span').text('2017년 10월 31일부터 현재까지') : $('p.info span').text('2015년 10월 7일부터 현재까지');
      (type === 'mm') ? $('.type').html('메가볼') : $('.type').html('파워볼');

      $('.stats_wrap').removeClass(oldGubun);
      $('.stats_wrap').addClass(gubun);
      $('.stats_numbers.pball').removeClass(oldGubun);
      $('.stats_numbers.pball').addClass(gubun);
      $('.logo-wrap img').attr('src', `/common/images/logo_${gubun}.png`);
      $(`#${oldType}`).parent().removeClass('on');
      $(`#${type}`).parent().addClass('on');

      $('.wball_list .numbers').closest('tr').remove();
      $('.pball_list .numbers').closest('tr').remove();

      getFrequency(type);
    };

    function getFrequency(type) {
      let sdate = $('#smonthpicker').val();
      let edate = $('#emonthpicker').val();

      if (sdate) {
        sdate = `${sdate}-01`;
        edate = `${edate}-01`;
      }

      $.post('./mode.php', {
        mode: 'getPrequency',
        gubun: type,
        sdate: sdate,
        edate: edate
      }, function(e) {
        makeBall(e);
      }, 'json');
    };

    function makeBall(res) {
      let data = null;

      for (const key in res) {
        if (key === 'winfo') {
          data = res.winfo;
        } else if (key === 'pinfo') {
          data = res.pinfo;
        }

        if (data) {
          const maxNumber = Math.max(...data.count.map(str => parseFloat(str)));
          const inputArray = data.number;
          const allNumbers = Array.from({ length: data.max[0] }, (_, index) => index + 1);

          allNumbers.forEach((number) => {
            let cnt = 0;
            if (inputArray.includes(number.toString())) {
              cnt = parseInt(data.count.shift());
            }

            let listItem = makeHtml(number, cnt, data.rowcount[0], maxNumber);

            if (data.max[0] > 30) {
              $('.wball_list').append(listItem);
            } else {
              $('.pball_list').append(listItem);
            }
          });
          setTextPosition();
        }
      }
    };

    function makeHtml(number, cnt, rowcount, maxNumber) {
      let roundedNumber = 0;
      let styleRatio = 0;
      if (cnt > 0) {
        let ratio = (cnt / rowcount) * 100;
        styleRatio = (cnt / maxNumber) * 100;
        roundedNumber = ratio.toFixed(1);
      }

      let html = `
        <tr class="numbers">
          <td>
            <p class="num">${number}</p>
          </td>
          <td>
            <div class="bar">
              <div class="frequency" style="width: ${styleRatio}%">
                <span class="bar_num">${cnt}회(${roundedNumber}%)</span>
              </div>
            </div>
          </td>
        </tr>
      `;
      return html;
    };

    function setTextPosition() {
      $('.bar').each(function() {
        let frequencyWidth = $(this).find('.frequency').width();
        let $bar_num = $(this).find('.bar_num');
        let bar_numWidth = $bar_num.width();

        if (frequencyWidth < bar_numWidth) {
          $bar_num.css('left', '0');
        } else {
          $bar_num.css('right', '0');
        }
      });
    };
  </script>
