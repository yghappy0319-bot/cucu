            <script type = "text/javascript">
            var sc_count = "<?=$_오늘참여여부['cnt']?>";
            $(function(){
             $("#news-container").vTicker({
               speed: 350,
               pause: 3000,
               animation: 'fade',
               mousePause: false,
               showItems: 9
             });

            });
            $(document).ready(function(){
              $('#redux').eraser('disable');
            });

            var sc_count = "<?=$_오늘참여여부['cnt']?>";
            var scratchVoucherProcessed = false;  // 스크래치 사용권 처리 여부
            if (sc_count == 0) {
                console.log("<?=$config['사이트명2']?> 스크래치 사용권이 부족합니다.");

            } else {
                $('#redux').eraser({
                    progressFunction: function(p) {
                        var lucky_point = $("#lucky_point").val();
                        $('#progress').html(Math.round(p * 100) + '%');
                        var percent = Math.round(p * 100);

                        // 스크래치 하는 순간 사용권 처리 (한 번만 실행)
                        if (percent >= 3 && !scratchVoucherProcessed) {
                            scratchVoucherProcessed = true;
                            go_event_set();
                        }

                        if (percent > 59) {
                            $('#redux').eraser('clear');
                            $('#progress').html('100%');
                            alert('축하드립니다!\n티켓구매시 바로 사용하실수 있는\n <?=$config['사이트명2']?> 포인트( ' + lucky_point + 'P )가 지급되었습니다!');
                            location.reload();
                        }
                    }
                });
            }

                $('#redux').click(function(event) {
                  if(sc_count==0){
                    alert("사용권이 부족하여 이용 할 수 없습니다. ");
                    return false;
                  }else{
                    if (!$('#redux').eraser('enabled')) {
                      alert("<?=$config['사이트명2']?> 스크래치 사용권 사용하기 버튼을 클릭한 후, 복권을 긁으면 사용권 1개가 소진됩니다.");
                      event.preventDefault();
                    }
                  }


                });

                $('#resetBtn').click(function(event) {
                  $('#redux').eraser('reset');
                    $('#progress').html('0%');
                  event.preventDefault();
                });

                $('#clearBtn').click(function(event) {
                  $('#redux').eraser('clear');
                    $('#progress').html('100%');
                    go_event_set();
                  event.preventDefault();
                });

                $('#toggleBtn').click(function(event) {
                  if(sc_count==0){
                    alert("사용권이 부족하여 이용 할 수 없습니다. ");
                    return false;
                  }

                  var $redux = $('#redux'),
                    $toggleBtn = $('#toggleBtn');

                  if ($redux.eraser('enabled')) {
                    $("#scratch_status").val(1);
                    $toggleBtn.text(' <?=$config['사이트명2']?> 스크래치 사용권 사용하기 ');
                    $redux.eraser('disable');

                  } else {
                    alert("복권 긁기를 시작해주세요!\n긁는 순간 사용권 1개가 소진됩니다.");
                    var status = $("#scratch_status").val();
                    console.log(status);
                    if(status!=1){
                      //location.reload();
                    }

                    $toggleBtn.text(' START ');
                    $redux.eraser('enable');
                    $("#toggleBtn").css("background-color","#1a2cdb");
                    $("#toggleBtn").css("color","#fff");
                    //$("#toggleBtn").remove();
                    $("#scratch_start").css("margin","12px");
                    $("#scratch_start").html("스크레치 기능이 작동하지 않을시 START 버튼을 다시 눌러주세요!");

                  }
                  event.preventDefault();
                });


              function go_event_set(){
                var params = jQuery("#scratch_frm").serialize();
                $.ajax({
                  type : "POST",
                  url: "_ajax_event_scratch_set.php",
                  async: false,
                  data: params,
                success: function(result) {

                  var obj = jQuery.parseJSON(result);
                  console.log(obj.status);
                  console.log(obj.point);
                  $("#lucky_point").val(obj.point);

                  if(obj.status==1){
                    var html = "";
                    html+= "<div class='lucky_point' >";
                    html+= "<div><?=$config['사이트명2']?> 포인트</div>";
                    html+= "<div class='scratch_point' >"+obj.point+"P 당첨!</div>";
                    html+= "<div class='scratch_info'><?=$config['사이트명2']?> 포인트는 티켓구매시 사용하실 수 있습니다.</div>";
                    html+= "<div class='scratch_info'>(지급완료)</div>";
                    html+= "</div>";
                    $("#robot_result").html(html);
                  }else{
                    var html = "";
                    html+= "<div class='lucky_point' >";
                    html+= "<div><?=$config['사이트명2']?> 스크래치!</div>";
                    html+= "<div>오늘은 사용완료!</div>";
                    html+= "<div class='scratch_point' >"+obj.point+"P 당첨!</div>";
                    html+= "<div class='scratch_info'>금일 <?=$config['사이트명2']?> 포인트는 지급 되었습니다!</div>";
                    html+= "<div class='scratch_info'>내일 또 이용해주세요!</div>";
                    html+= "</div>";
                    $("#robot_result").html(html);
                    location.reload();
                  }


                  // if(r!=1){
                  //   alert("관리자에게 문의해주세요!");
                  //   location.href="/";
                  // }

                  },
                  error:function(e) {
                    alert(e.responseText);
                  }
                });
              }
