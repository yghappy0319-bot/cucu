<script>
  $(function() {
    // 선택삭제
    $(document).on('click', '.allDelChk', function() {
      let chk_no = new Array();
      let i = 0;
      $('[name="noChk[]"]:checked').each(function() {
        chk_no[i] = $(this).val();
        i++;
      });

      if (i > 0) {
        if (confirm('선택한 항목을 삭제하시겠습니까?')) {
          $.post('./default.php', {
            mode: 'all_del',
            gubun: 'GOODS',
            chk_no: chk_no
          }, function(e) {
            if (e.error) {
              alert(e.msg);
            } else {
              alert(e.msg);
            }
            window.location.reload();
          }, 'json');
        }
      } else {
        alert('삭제할 항목을 선택하세요');
      }
    });
  });
</script>
