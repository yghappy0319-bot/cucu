    <script>
    (function() {
      // window.name 우선, 없으면 URL _win 을 채택(새로 만들면 로그인 세션이 끊김)
      var params = new URLSearchParams(location.search);
      var urlWin = params.get('_win') || '';
      urlWin = urlWin.replace(/[^a-zA-Z0-9]/g, '').slice(0, 32);
      var namedWin = (window.name && window.name.indexOf('ADMIN_WIN_') === 0)
        ? window.name.replace(/^ADMIN_WIN_/, '')
        : '';
      var winId = namedWin || urlWin || Math.random().toString(36).slice(2, 12);
      window.name = 'ADMIN_WIN_' + winId;
      if (params.get('_win') !== winId) {
        params.set('_win', winId);
        location.replace(location.pathname + '?' + params.toString() + location.hash);
      }
    })();
    </script>
