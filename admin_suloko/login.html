            <h6 class="modal-title"><strong>2차 인증</strong></h6><button aria-label="Close" class="btn-close" data-bs-dismiss="modal" ><span aria-hidden="true">&times;</span></button>

            </div>

    <!-- JQUERY JS -->

    <script>
      function adminEnsureWinId() {
        var namedWin = (window.name && window.name.indexOf('ADMIN_WIN_') === 0)
          ? window.name.replace(/^ADMIN_WIN_/, '')
          : '';
        if (namedWin) return namedWin;
        var params = new URLSearchParams(location.search);
        var urlWin = (params.get('_win') || '').replace(/[^a-zA-Z0-9]/g, '').slice(0, 32);
        var winId = urlWin || Math.random().toString(36).slice(2, 12);
        window.name = 'ADMIN_WIN_' + winId;
        return winId;
      }

      (function() {
        var winId = adminEnsureWinId();
        $('#_win').val(winId);
        var params = new URLSearchParams(location.search);
        if (params.get('_win') !== winId) {
          params.set('_win', winId);
          history.replaceState(null, '', location.pathname + '?' + params.toString());
        }
      })();

      $(document).on('click', '.login-btn', function() {
        let user_id = $("#user_id").val();
        let user_pw = $("#user_pw").val();

        if (user_id == "") {
          alert("아이디를 입력해 주세요.");
          return false;
        }

        if (user_pw == "") {
          alert("비밀번호를 입력해 주세요.");
          return false;
        }

        $('#_win').val(adminEnsureWinId());
        $.post('./login_chk.php?_win=' + encodeURIComponent(adminEnsureWinId()), $('#login_frm').serialize(), function(e) {
          if (!e.error) {
            if (e.msg == "otp") {
              $("#otp_modal")[0].click();
            } else {
              location.replace(e.msg);
            }
          } else {
            alert(e.msg);
          }
        }, 'json');
      });

      $(document).on('click', '.otp-btn', function() {
        let otp_nums = $("#otp_nums").val();
        let user_id = $("#user_id").val();

        if (otp_nums == "") {
          alert("OTP인증번호를 입력하세요.");
          return false;
        } else {
          $("#mode").val("step2");
          $("#user_otp").val(otp_nums);
        }

        $('#_win').val(adminEnsureWinId());
        $.post('./login_chk.php?_win=' + encodeURIComponent(adminEnsureWinId()), $('#login_frm').serialize(), function(e) {
          if (!e.error) {
            location.replace(e.msg);
          } else {
            alert(e.msg);
          }
        }, 'json');
      });

      $('#user_pw').keyup(function() {
        if (event.keyCode == 13) {
          $('.login-btn').click();
        }
      });

      $('#otp_nums').keyup(function() {
        if (event.keyCode == 13) {
          $('.otp-btn').click();
        }
      });

      $('.modal').on('shown.bs.modal', function() {
        $(this).find('[autofocus]').focus();
      });

      function maxLengthCheck(object) {
        if (object.value.length > object.maxLength) {
          object.value = object.value.slice(0, object.maxLength);
        }
      }
    </script>
