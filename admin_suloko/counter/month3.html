  $add_query = "";

  if ($type == "무통장") {
    $add_query .= "AND CARDNAME = '무통장'";
  } else if ($type == '카드') {
    $add_query .= "AND CARDNAME != '무통장'";
  }

  // 22만/12만 카드결제 숨김 ON (무통장 유지, 상품 주문내역 미적용)
  $add_query .= get_sales_page_hide_filter('');
  $canceled_sql = get_cash_sales_canceled_sql();

  // 해당월 결제 데이터 (승인월 +금액, 취소월 -금액)
  $query = "
    SELECT
      LEFT(DT, 7) AS DATE,
      SUM(PRICE) AS PRICE,
      SUM(CNT) AS CNT
    FROM (
      SELECT
        IFNULL(CON_REG_DATE, REG_DATE) AS DT,
        PRICE,
        1 AS CNT
      FROM CASH
      WHERE
        LEFT(IFNULL(CON_REG_DATE, REG_DATE), 4) = '{$sdate}'
        AND (IS_USE = 'Y' OR {$canceled_sql})
        $add_query

      UNION ALL

      SELECT
        CANCAL_DATE AS DT,
        -PRICE AS PRICE,
        -1 AS CNT
      FROM CASH
      WHERE
        LEFT(CANCAL_DATE, 4) = '{$sdate}'
        AND {$canceled_sql}
        $add_query
    ) sales_net
    GROUP BY LEFT(DT, 7)
    ORDER BY LEFT(DT, 7) ASC
  ";
  $list = $db->get_list($query);

  $type_op = array(
    "무통장" => "무통장",
    "카드" => "카드"
  );
