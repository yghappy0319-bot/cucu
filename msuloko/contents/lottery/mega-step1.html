  <script>
    document.querySelector('.btnTg').addEventListener('click', () => {
      const mmbFoot = document.querySelector('.mmbFoot');
      const mmbWrap = document.querySelector('.mmbWrap');
      const btnTg = document.querySelector('.btnTg');

      if (mmbFoot.style.display === 'none') {
        mmbFoot.style.display = 'block';
        mmbFoot.style.opacity = 1;
        mmbWrap.style.height = 'auto';
        btnTg.style.transform = 'rotate(0deg)';
      } else {
        mmbFoot.style.opacity = 0;
        setTimeout(() => {
          mmbFoot.style.display = 'none';
        }, 300);
        btnTg.style.transform = 'rotate(180deg)';
      }
    });
  </script>
