<script>
  $(function() {
    let page = 1;
    list_read(page);

    $(document).on('click', '.type_btn_more', function() {
      page++;
      list_read(page);
    });
  });

  function list_read(page) {
    $.post('/other.php', {
      mode: 'my_lotto_number_list',
      page: page
    }, function(e) {
      $('.type_btn_more').before(e.html);

      if (e.html == '') {
        $('.type_btn_more').hide();
      }

      if ($('#list_box').find('tbody').length <= 0 && page == 1) {
        let html = `<p class='txt_center mt20 fs25'>등록된 내역이 없습니다.</p>`;
        $('#list_box').html(html);
      }
    }, 'json');
  }

  function del_my_number(ball_no, balls) {
    let	con = confirm('번호를 삭제하시겠습니까?');
    if (con == true) {
      $.post('/other.php', {
        mode: 'my_lotto_number_each_del',
        ball_no: ball_no,
        balls: balls
      }, function(e) {
        open('/contents/mypage/mynumber.html', '_self');
      }, 'json');
    }
  }
</script>
