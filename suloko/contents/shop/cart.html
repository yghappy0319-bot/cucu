<script>
    // 상품 데이터
    var product_name = "<?=$item['product_name']?>";
    var product_price = "<?=$item['product_price'] * $quantity?>";
    const products = [
        { name: product_name, price: product_price, quantity: 1 }
    ];

    // 수량 변경
    function changeQuantity(index, change) {
        const quantityInput = document.querySelectorAll('.quantity-input')[index];
        let newQuantity = parseInt(quantityInput.value) + change;

        if (newQuantity < 1) newQuantity = 1;

        quantityInput.value = newQuantity;
        updateQuantity(index, newQuantity);
    }

    // 수량 업데이트
    function updateQuantity(index, quantity) {
        quantity = parseInt(quantity);
        if (quantity < 1) quantity = 1;

        products[index].quantity = quantity;

        // 개별 상품 총액 업데이트
        const itemTotal = products[index].price * quantity;
        document.getElementById(`total-${index}`).textContent = itemTotal.toLocaleString() + '원';

        // 전체 총액 업데이트
        updateTotals();
    }

    // 총액 계산
    function updateTotals() {
        const subtotal = products.reduce((sum, product) => sum + (product.price * product.quantity), 0);
        const shipping = 3000;
        const finalTotal = subtotal + shipping;

        document.getElementById('subtotal').textContent = subtotal.toLocaleString() + '원';
        document.getElementById('final-total').textContent = finalTotal.toLocaleString() + '원';
    }

    // 주문하기
    function submitOrder() {
        const name = document.querySelector('input[name="order_name"]').value;
        const phone = document.querySelector('input[name="order_phone"]').value;
        const zipcode = document.querySelector('input[name="order_zipcode"]').value;

        const address1 = document.querySelector('input[name="order_address1"]').value;
        const address2 = document.querySelector('input[name="order_address2"]').value;


        if (!name || !phone || !zipcode || !address1 || !address2) {
            alert('필수 정보를 모두 입력해주세요.');
            return;
        }



        var total = $("#total").val();
        var totalamount = total.toLocaleString();
        if(confirm(totalamount+"원이 차감됩니다. 구매하시겠습니까?")){

            const button = document.querySelector('.order-button');
            button.textContent = '주문 처리중...';
            button.disabled = true;

            var params = jQuery("#orderFrm").serialize();
            $.ajax({
                type : "POST",
                url: "order_action.php",
                async: false,
                data: params,
                dataType: "json",
                success: function(result) {
                    console.log(result);
                    if(result.status==1){
                        alert(result.msg);
                        location.href="/contents/shop/order-list.html";
                    }else{
                        alert(result.msg);
                        button.textContent = '주문하기';
                        button.disabled = false;
                    }

                },
                error:function(e) {
                    alert(e.responseText);
                }
            });
        }


        // setTimeout(() => {
        //     alert('주문이 완료되었습니다!');
        //     button.textContent = '주문하기';
        //     button.disabled = false;
        // }, 2000);
    }

    // 초기 총액 계산
    updateTotals();
</script>
<script>
    function execDaumPostcode() {
        var element_layer = document.getElementById('daum_postcode_layer');

        new daum.Postcode({
            oncomplete: function(data) {
                // 주소 조립
                var fullAddress = data.roadAddress; // 기본 주소
                var extraAddress = '';

                // 참고항목 추가
                if(data.userSelectedType === 'R'){
                    if(data.bname !== '' && /[동|로|가]$/g.test(data.bname)){
                        extraAddress += data.bname;
                    }
                    if(data.buildingName !== ''){
                        extraAddress += (extraAddress !== '' ? ', ' + data.buildingName : data.buildingName);
                    }
                    if(extraAddress !== ''){
                        fullAddress += ' (' + extraAddress + ')';
                    }
                }

                // 값 채우기
                document.getElementById('order_zipcode').value = data.zonecode;
                document.getElementById('order_address1').value = fullAddress;

                // 상세주소로 포커스 이동
                document.getElementById('order_address2').focus();

                // 레이어 숨김
                element_layer.style.display = 'none';
            },
            width : '100%',
            height : '100%',
            maxSuggestItems: 5
        }).embed(element_layer);  // 레이어 팝업으로 띄움

        // 레이어 표시
        element_layer.style.display = 'block';
    }
</script>
