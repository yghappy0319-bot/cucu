<script>
  $(function() {
    // 선택 삭제
    $(document).on('click', '.allDelChk', function() {
      let chk_no = new Array();
      let i = 0;
      $('[name="noChk[]"]:checked').each(function() {
        chk_no[i] = $(this).val();
        i++;
      });

      if (i > 0) {
        if (confirm("선택한 항목을 삭제하시겠습니까?")) {
          $.post('./default.php', {
            mode: 'all_del',
            gubun: 'SMSTEMPLET',
            chk_no: chk_no
          }, function(e) {
            if (e.error) {
              alert(e.msg);
            } else {
              alert(e.msg);
            }
            window.location.reload();
          }, 'json');
        }
      } else {
        alert('삭제할 항목을 선택하세요');
      }
    });

    $(document).on('click', '#btn_add_active', function() {
      $('.add_form').show();
    });

    $(document).on('click', '.btn_add_cancel', function() {
      $('.add_form').hide();
    });

    // 추가
    $(document).on('click', '.btn_add', function() {
      $.post('./default.php', $('#w_frm').serialize(), function(e) {
        if (e.error) {
          $('#w_frm').submit();
          window.location.reload()
        } else {
          alert(e.msg);
        }
      }, 'json');
    });

    $(document).on('click', '.btn_update_form', function() {
      let no = $(this).data('no');
      $('#view_w_frm'+no).show();
    });

    $(document).on('click', '.btn_cancel_form', function() {
      let no = $(this).data('no');
      $('#view_w_frm'+no).hide();
    });

    // 수정
    $(document).on('click', '.btn_update', function() {
      let no = $(this).data('no');

      $.post('./default.php', $('#w_frm' + no).serialize(), function(e) {
        if (e.error) {
          $('#w_frm').submit();
          window.location.reload();
        } else {
          alert(e.msg);
        }
      }, 'json');
    });

    // 삭제
    $(document).on('click', '.btn_delete', function() {
      let no = $(this).data('no');

      if (confirm('삭제 하시겠습니다?\n삭제후 복원은 불가능합니다.')) {
        $.post('./default.php', {
          mode: 'sms_delete_sender',
          no: no
        }, function(e) {
          let res = JSON.parse(e);

          if (res.error == false) {
            alert(res.msg);
            return false;
          } else {
            window.location.reload();
          }
        });
      }
    });

    let getHeight = $('.table-wrapper').css('max-height');
    let setHeight = Number(getHeight.slice(0, -2)) + 70;

    // 해상도에 따라 높이 조절
    $('.table-wrapper').css('max-height', setHeight);
  });
</script>
