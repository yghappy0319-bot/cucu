<script>
  $(function() {
    let page = 1;
    list_read(page);

    $(document).on('click', '.type_btn_more', function() {
      page++;
      list_read(page);
    });

    $(document).on('click', '.reply_on', function() {
      if ($(this).is('.open')) {
        $(this).removeClass('open');
        $(this).parent().parent().parent().parent().find('.bx_answer').slideUp();
      } else {
        $(this).addClass('open');
        $(this).parent().parent().parent().parent().find('.bx_answer').slideDown();

        let no = $(this).data('no');
        $.post('./mode.php', {
          mode: 'qna_user_read',
          no: no
        }, function(e) {
        }, 'json');
      }
    });
  });

  function list_read(page) {
    $.post('/other.php', {
      mode: 'my_bbs_list',
      page: page
    }, function(e) {
      $('#list_box').append(e.html);

      if (e.html == '') {
        $('.type_btn_more').hide();
      }

      if ($('#list_box').find('tbody').length <= 0 && page == 1) {
        let html = `<p style="text-align: center; margin-top: 10px; font-size: var(--px25);">등록된 글이 없습니다.</p> `;
        $('#list_box').html(html);
      }
    }, 'json');
  }
</script>
