    <script>
    (function() {
      function ensureWinId() {
        var namedWin = (window.name && window.name.indexOf('ADMIN_WIN_') === 0)
          ? window.name.replace(/^ADMIN_WIN_/, '')
          : '';
        if (namedWin) return namedWin;
        var params = new URLSearchParams(location.search);
        var urlWin = (params.get('_win') || '').replace(/[^a-zA-Z0-9]/g, '').slice(0, 32);
        var winId = urlWin || Math.random().toString(36).slice(2, 12);
        window.name = 'ADMIN_WIN_' + winId;
        return winId;
      }

      var winId = ensureWinId();

      function ensureWinInput(form) {
        if (!form || form.tagName !== 'FORM') return;
        var input = form.querySelector('input[name="_win"]');
        if (!input) {
          input = document.createElement('input');
          input.type = 'hidden';
          input.name = '_win';
          form.appendChild(input);
        }
        input.value = winId;
      }

      function withWin(url) {
        if (!url || url.indexOf('javascript:') === 0 || url.charAt(0) === '#') return url;
        if (/^https?:\/\//i.test(url) && url.indexOf(location.origin) !== 0) return url;
        try {
          // location.origin만 쓰면 상대경로(qna_action.php)가 루트(/qna_action.php)로 바뀌어 404 발생
          var abs = new URL(url, location.href);
          abs.searchParams.set('_win', winId);
          return abs.pathname + abs.search + abs.hash;
        } catch (e) {
          return url;
        }
      }

      // 모든 폼에 _win 미리 삽입 (form.submit() 이벤트 미발생 대비)
      function injectAllForms() {
        var forms = document.getElementsByTagName('form');
        for (var i = 0; i < forms.length; i++) {
          ensureWinInput(forms[i]);
        }
      }
      injectAllForms();
      document.addEventListener('DOMContentLoaded', injectAllForms);

      // native form.submit() 패치
      var nativeSubmit = HTMLFormElement.prototype.submit;
      HTMLFormElement.prototype.submit = function() {
        ensureWinInput(this);
        if (this.getAttribute('action')) {
          this.setAttribute('action', withWin(this.getAttribute('action')));
        }
        return nativeSubmit.apply(this, arguments);
      };

      if (window.jQuery) {
        jQuery.ajaxPrefilter(function(opts) {
          if (opts.url) opts.url = withWin(opts.url);
          if (opts.data && typeof opts.data === 'string' && opts.data.indexOf('_win=') === -1) {
            opts.data += (opts.data.length ? '&' : '') + '_win=' + encodeURIComponent(winId);
          } else if (opts.data && typeof opts.data === 'object' && opts.data._win === undefined) {
            opts.data._win = winId;
          }
        });
      }

      document.addEventListener('click', function(e) {
        var a = e.target.closest && e.target.closest('a[href]');
        if (!a) return;
        var href = a.getAttribute('href');
        if (!href || href.indexOf('javascript:') === 0 || href.charAt(0) === '#') return;
        a.setAttribute('href', withWin(href));
      }, true);

      document.addEventListener('submit', function(e) {
        var f = e.target;
        if (!f || f.tagName !== 'FORM') return;
        ensureWinInput(f);
        if (f.getAttribute('action')) f.setAttribute('action', withWin(f.getAttribute('action')));
      }, true);
    })();
    </script>

<script>
  $(document).ready(function() {
    $('.slide-menu').show();
    side_menu_scroll();

    if ($(window).width() > 480) {
      // 해상도에 따라 높이 조절
      $('.table-wrapper').css('max-height', $(window).height() - 450);
    }
  });

  function side_menu_scroll() {
    let n = 0;
    let k = 0;
    let height_num = 40; // 기본 높이값

    $('.side-menu__item').each(function() {
      n++;
      if ($(this).hasClass('active')) k = n;
    });

    $('.side-menu').find('.slide').each( function(idx, item) {
      if (k == idx + 1) return false; // 선택된 메뉴면 break;
      height_num = height_num + Number($('.side-menu').find('.slide').eq(idx).height());
    });
    if (k > 0) {
      if (k == 1) height_num = height_num - 5;
      $('.side-menu').animate({scrollTop: height_num}, 0); // 메뉴 스크롤 이동
    }
  }
</script>
