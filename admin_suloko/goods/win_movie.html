<script>
  $(function() {
    $(document).on('click', '.ballFunC', function() {
      let play_date = $(this).data('pdate');
      $.post('./default.php', {
        mode: 'wininfo_yutube',
        play_date: play_date
      }, function(e){
        if (e.error) {
          $('#ball_gubun').val(e.gubun);
          $('#play_date').val(e.kor_play_date);
          $('#YUTUBE').val(e.yutube);
        } else {
          alert('정확한 추첨일자를 입력해 주세요.');
        }
      }, 'json');
    });

    $(document).on('click', '#btn-yutube-in', function() {
      let gubun = $('#ball_gubun').val();
      let play_date = $('#play_date').val();
      let yutube = $('#YUTUBE').val();

      $.post('./default.php', {
        mode: 'btn-yutube-in',
        play_date: play_date,
        yutube: yutube
      }, function(e) {
        alert(e.msg);
        if (e.error) {
          window.location.reload();
        }
      }, 'json');
    });

    let getHeight = $('.table-wrapper').css('max-height');
    let setHeight = Number(getHeight.slice(0, -2)) - 50;

    // 해상도에 따라 높이 조절
    $('.table-wrapper').css('max-height', setHeight);
  });
</script>
