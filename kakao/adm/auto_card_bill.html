<script type="text/javascript">
    function setDate() {
        var d = new Date();
        var year = d.getFullYear();
        var month = d.getMonth() + 1;
        var date = d.getDate();
        if (month < 10) {
            month = '0' + month;
        }
        if (date < 10) {
            date = '0' + date;
        }

        for (var i = 0; i < document.getElementsByName("moid").length; i++) {
            document.getElementsByName("moid")[i].value = year + "" + month + "" + date + "001";
        }

        for (var i = 0; i < document.getElementsByName("payExpDate").length; i++) {
            document.getElementsByName("payExpDate")[i].value = year + "" + month + "" + date + "235959";
        }
    }

    function send() {
        var params = jQuery("#orderFrm").serialize();
        $.ajax({
            type: "POST",
            url: "/ajax/_ajax_card_bill_key.php",
            async: false,
            data: params,
            dataType: "json",
            success: function(result) {
                console.log(result);
                if (result.resultCode == "0000") {
                    alert(result.resultMsg);
                    location.reload();
                } else {
                    alert(result.resultMsg);
                    location.reload();
                    return false;
                }
            },
            error: function(e) {
                alert(e.responseText);
            }
        });
    }

    function back() {
      window.close();
    }
</script>
<script type="text/javascript">
