<script>
    const basePrice = "<?=$product['product_price']?>";

    function changeQuantity(change) {
        const quantityInput = document.getElementById('quantity');
        let newQuantity = parseInt(quantityInput.value) + change;

        if (newQuantity < 1) newQuantity = 1;

        quantityInput.value = newQuantity;
        console.log(newQuantity);

        $("#order_quantity").val(newQuantity);
        updateTotal();
    }

    function updateTotal() {
        const quantity = parseInt(document.getElementById('quantity').value) || 1;
        const total = basePrice * quantity;
        document.getElementById('total-price').textContent = total.toLocaleString() + '원';
    }

    function addToCart() {
        const quantity = document.getElementById('quantity').value;
        const button = document.querySelector('.btn-cart');

        button.textContent = '추가됨!';
        button.style.backgroundColor = '#666';
        button.style.color = 'white';

        setTimeout(() => {
            button.textContent = '장바구니';
            button.style.backgroundColor = 'white';
            button.style.color = '#333';
        }, 1500);

        console.log(`장바구니에 ${quantity}개 추가`);
    }

    function buyNow(obj) {
        const quantity = document.getElementById('quantity').value;
        $("#product").val(obj);
        $("#order_quantity").val(quantity);
        $("#orderFrm").submit();
    }

    function goToProduct(productId) {
        console.log(`${productId} 상품으로 이동`);
    }

    function goToProductList() {
        console.log('상품 리스트로 이동');
    }

    // 초기 총액 설정
    updateTotal();
</script>
