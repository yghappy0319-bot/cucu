  $date_op = array();
  $start_month = "2022-03";

    $ndate = date("Y-m", strtotime("{$start_month}-01 first day of +{$i} month"));
    $date_op[$ndate] = $ndate;
    if ($ndate == date("Y-m")) break;
  }
  $date_op = array_reverse($date_op);

  $add_query = "";

  if ($type == "무통장") {
    $add_query .= "AND CARDNAME = '무통장'";
  } else if ($type == '카드') {
    $add_query .= "AND CARDNAME != '무통장'";
  } else if ($type == '카드2') {
    $add_query .= "AND CARDNAME = '카드'";
  }

  // 22만/12만 카드결제 숨김 ON (무통장 유지, 상품 주문내역 미적용)
  $add_query .= get_staff_hide_card_payment_filter('');

  // 해당일 결제 데이터
  $query = "
    SELECT
      LEFT(IFNULL(CON_REG_DATE, REG_DATE), 10) AS DATE,
      SUM(PRICE) AS PRICE,
      COUNT(PRICE) AS CNT
    FROM CASH
    WHERE
      IS_USE = 'Y'
      $add_query
      AND LEFT(IFNULL(CON_REG_DATE, REG_DATE), 7) = '{$sdate}'
    GROUP BY LEFT(IFNULL(CON_REG_DATE, REG_DATE), 10)
    ORDER BY LEFT(IFNULL(CON_REG_DATE, REG_DATE), 10) ASC
  ";
  $list = $db->get_list($query);

  $type_op = array(

    "카드"  => "카드",

    );
