<script>
  function go_send_mail(){
    var email_address = $("#mail_number").val();
    var sms_send_chk = $("#sms_send_chk").val();
    var user_name = $("#user_name").val();
    var sms_number = $("#sms_number").val();

    if(user_name==""){
      alert("이름을 입력해주세요.");
      return false;
    }

    if(sms_number==""){
      alert("휴대폰번호를 입력해주세요.");
      return false;
    }

    if(email_address==""){
      alert("이메일주소를 입력해주세요.");
      return false;
    }

    if(sms_send_chk==1){
      alert("인증번호가 발송되었습니다.\n인증문자가 도착하지 않았다면 새로고침 후 재발송 해주세요.");
      $(".emailcode").remove();
      return false;
    }

    $.ajax({
       type : "POST",
       url: "_ajax_send_code_mail.php",
       async: true,
       data: {
          user_name : user_name,
          sms_number : sms_number,
          email_address : email_address,
          pages : '아이디찾기'
       },
       dataType: "json",
       beforeSend: function() {
         if(sms_send_chk==1){
           alert("메일보내기가 진행중 입니다. 결과가 나올때까지 잠시만 기다려주세요.");
           return false;
         }
       },
       success: function(result) {
          console.log(result);
          //return false;
          if(result.status==1){
            $("#email_address").prop("readonly", true);
            $("#sms_send_chk").val(1);
            //$(".code_input_email").show();
            alert("귀하의 이메일로 가입시 설정하신 아이디를 전송 하였습니다.\n이메일로 아이디를 확인해주시기 바랍니다.\n*이메일을 받지 못하였다면 1:1문의에 남겨주세요.");
            $(".emailcode").remove();
            return false;
          }else if(result.msg=="over"){
            alert("금일 인증메일 발송횟수가 초과되었습니다.\n관리자에게 문의해 주시거나 내일 다시 시도해주세요.");

            return false;
          }else{
            alert(result.msg);
            return false;
          }
       },
       error:function(e) {
          alert(e.responseText);
       }
    });

  }

  function go_send_sms(){
    var authtype = "<?=$아이디찾기?>";
    var name = $("#user_name").val();
    var phone = $("#sms_number").val();
    var sms_send_chk = $("#sms_send_chk").val();
    if(phone==""){
      alert("휴대폰번호를 입력해주세요.");
      return false;
    }

    if(sms_send_chk==1){
      alert("인증번호가 발송되었습니다.\n인증문자가 도착하지 않았다면 새로고침 후 재발송 해주세요.");
      $(".phonecode").remove();
      return false;
    }

    $.ajax({
       type : "POST",
       url: "ajax_send_sms.php",
       async: false,
       data: {
           name : name,
          phone : phone,
          pages : '아이디찾기'
       },
       success: function(result) {
          var r = result.trim();
          console.log(r);
          if(r==1){
            $("#phone").prop("readonly", true);
            $("#sms_send_chk").val(1);

            if(authtype=="바로찾기"){
              alert("입력하신 휴대폰번호로 아이디가 발송 되었습니다.");

            }else{
              $(".code_input").show();
              alert("인증번호가 발송되었습니다.\n문자가 도착하지 않았다면 새로고침 후 재발송 해주세요.");
            }

            $(".phonecode").remove();
            return false;
          }else if(r=="over"){
            alert("금일 인증문자 발송개수가 초과되었습니다.\n관리자에게 문의해 주시거나 내일 다시 시도해주세요.");
            go_chet();
            return false;
          }else{
            alert(r);
            return false;
          }
       },
       error:function(e) {
          alert(e.responseText);
       }
    });
  }

  function go_code_chke(obj){
    var phone = $("#"+obj+"_number").val();
    var smscode = $("#"+obj+"code").val();
    if(smscode==""){
      alert("인증번호를 입력해주세요.");
      return false;
    }

    $.ajax({
       type : "POST",
       url: "ajax_sms_code_chk.php",
       async: false,
       data: {
          smscode : smscode,
          phone : phone,
          page : "idfind",
          sendtype : obj
       },
       success: function(result) {
         console.log(result);
        var obj = jQuery.parseJSON(result);
        if(obj.msg=="success"){
          $("#smscode").prop("readonly", true);
          alert("인증번호가 확인되었습니다.");
          $("#find_id").val(obj.member_id);
          $("#idFindFrm").attr("action","/member/find_id_result.html");
          $("#idFindFrm").submit();
        }else{
          alert("인증번호를 확인해주세요.");
        }

       },
       error:function(e) {
          alert(e.responseText);
       }
    },'json');
  }
