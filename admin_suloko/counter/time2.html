  $now = date("Y-m-d");

  if ($sdate != "") {
    $now = $sdate;
  }

  $add_query = "";

  if ($type == "무통장") {
    $add_query .= "CARDNAME = '무통장' AND";
  } else if ($type == '카드') {
    $add_query .= "CARDNAME != '무통장' AND";
  }

  // 22만/12만 카드결제 숨김 ON (무통장 유지, 상품 주문내역 미적용)
  $hide_filter = get_sales_page_hide_filter('');
  $canceled_sql = get_cash_sales_canceled_sql();

  // 해당일 결제 데이터 (승인시간 +금액, 취소시간 -금액)
  $query = "
    SELECT
      CONCAT(LEFT(DT, 13), ':00') AS TIME,
      SUM(PRICE) AS PRICE,
      SUM(CNT) AS CNT
    FROM (
      SELECT
        IFNULL(CON_REG_DATE, REG_DATE) AS DT,
        PRICE,
        1 AS CNT
      FROM CASH
      WHERE
        LEFT(IFNULL(CON_REG_DATE, REG_DATE), 10) = '{$now}'
        AND (IS_USE = 'Y' OR {$canceled_sql})
        AND $add_query
        1=1
        $hide_filter

      UNION ALL

      SELECT
        CANCAL_DATE AS DT,
        -PRICE AS PRICE,
        -1 AS CNT
      FROM CASH
      WHERE
        LEFT(CANCAL_DATE, 10) = '{$now}'
        AND {$canceled_sql}
        AND $add_query
        1=1
        $hide_filter
    ) sales_net
    GROUP BY CONCAT(LEFT(DT, 13), ':00')
    ORDER BY CONCAT(LEFT(DT, 13), ':00') ASC
  ";
  $list = $db->get_list($query);

  $type_op = array(
    "무통장" => "무통장",
    "카드" => "카드"
  );
