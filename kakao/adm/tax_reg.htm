<script>
  function go_alram_number_show(){
    if(login_id=="testuser"){
      alert("테스트 아이디는 수정/삭제가 불가 합니다.");
      return false;
    }
    var bank = $("#bank").val();
    var ebox = $('.alram_number').is(':visible');

    if(!bank){
      alert("은행을 선택해주세요.");
      return false;
    }
    console.log(ebox);
    $("#alram_box_status").val(ebox);
    $(".alram_number").toggle();
    $(".auth_code").show();
    if(bank=="하나은행" || bank=="국민은행"){
      alert(bank+"은 인증절차가 없으므로 통보번호만 등록해주시면 됩니다.");
      $(".auth_code").html(bank+"은 인증절차가 없습니다! 통보번호만 등록해주세요!");
      go_chk();
      return false;
    }

    go_auth_number();
  }

let pollingTimer;
function go_auth_number(){
  console.log('호출');
  var bank = $("#bank").val();
  $.ajax({
     type : "POST",
     url: "/ajax/_ajax_bank_code_chk.php",
     async: false,
     data: {
       bank : bank
     },
     dataType: 'json',
     success: function(result) {
       console.log(result);
       if(result.code>0){
         var btn = "<button type='button' onclick='go_chk("+ result.idx +")' >확인</button>";
         $(".auth_code").html("인증번호 <font color='red'>"+result.code+"</font> 을 입력해주세요." +btn);
       }else{
         $(".auth_code").html("010-3964-3966 번호로 수신된 인증번호가 없습니다. 잠시만 기다려 주세요.");
       }

     },
     error:function(e) {
        alert(e.responseText);
     },
     complete: function() {
        // 5초 후에 다시 폴링을 실행합니다.
         pollingTimer = setTimeout(go_auth_number, 5000);
     }
  });
}

function go_chk(obj){
  clearTimeout(pollingTimer);
  if(confirm("인증번호를 확인 하셨습니까?")){
    var bank = $("#bank").val();
    var acount = $("#user_acount").val();
    if(!acount){
      alert("계좌번호를 정확히 입력해주세요.");
      return false;
    }
    $.ajax({
       type : "POST",
       url: "/ajax/_ajax_bank_code_ok.php",
       async: false,
       data: {
         idx : obj,
         bank : bank,
         acount : acount
       },
       success: function(result) {
          var r = result.trim();
          $("#o_acount").val(r);

       },
       error:function(e) {
          alert(e.responseText);
       }
    });
  }
}

function go_new_phone(){
  if(login_id=="testuser"){
    alert("테스트 아이디는 수정/삭제가 불가 합니다.");
    return false;
  }

  var bank = $("#bank").val();
  var phone = $("#phone").val();
  var sms_status = $("#sms_status").val();

  if(sms_status==1){
    alert("문자가 발송되었습니다. 문자가 오지 않았을경우 새로고침 후 다시 신청해주세요.");
    return false;
  }

  $.ajax({
     type : "POST",
     url: "_ajax_send_number.php",
     async: false,
     data: {
       bank : bank,
       phone : phone
     },
     success: function(result) {
        var r = result.trim();
        console.log(r);
        if(r==1){
          $("#sms_status").val(1);
          $("#phone").attr("readonly",true);
          alert("발송되었습니다.");
          $("#errorlist_number").show();
        }else{
          alert(r);
        }

     },
     error:function(e) {
        alert(e.responseText);
     }
  });
}
