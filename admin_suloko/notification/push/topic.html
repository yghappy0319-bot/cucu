<script>
  $(function() {
    // 구독 추가 view
    $(document).on('click', '#btn_add_active', function() {
      $(this).hide();
      $('.add_form').show();
    });

    // 구독 추가
    $(document).on('click', '.btn_add', function() {
      $.post('./default.php', $('#w_frm').serialize(), function(e) {
        if (!e.error) {
          $('#w_frm').submit();
          location.reload();
        } else {
          alert(e.msg);
        }
      }, 'json');
    });

    // 구독 추가 취소
    $(document).on('click', '.btn_cancel', function() {
      $('#btn_add_active').show();
      $('#w_frm')[0].reset();
      $('.add_form').hide();
    });

    // 구독 수정 view
    $(document).on('click', '.btn_update_form', function() {
      $('[id^=view_w_frm]').hide();
      $('.btn_update_form').show();

      let no = $(this).data('no');
      $('#view_w_frm' + no).show();
      $(this).hide();
    });

    // 구독 수정 취소
    $(document).on('click', '.btn_cancel_form', function() {
      $('.btn_update_form').show();
      let no = $(this).data('no');
      $('#view_w_frm' + no).hide();
    });

    // 구독 수정
    $(document).on('click', '.btn_update', function() {
      let no = $(this).data('no');

      if (confirm('수정하시겠습니까?')) {
        $.post('./default.php', $('#w_frm' + no).serialize(), function(e) {
          if (e.error) {
            alert(e.msg);
          } else {
            $('#w_frm').submit();
            window.location.reload();
          }
        }, 'json');
      }
    });

    // 구독 삭제
    $(document).on('click', '.btn_delete', function() {
      let no = $(this).data('no');

      if (confirm('삭제하시겠습니까?')) {
        $.post('./default.php', {
          mode: 'delete_topic',
          no: no
        }, function(e) {
          let res = JSON.parse(e);
          if (!res.error) {
            location.reload();
          } else {
            alert(res.msg);
          }
        });
      }
    });
  });
</script>
